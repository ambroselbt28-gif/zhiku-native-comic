<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智库漫画合成验证</title>
<style>
body { margin: 16px; font-family: sans-serif; }
#chat { max-width: 680px; margin: auto; }
#settings { max-width: 680px; margin: auto; }
button { min-height: 36px; }
textarea, input, select { max-width: 100%; box-sizing: border-box; }
.pc-seg { display: flex; flex-wrap: wrap; }
.pc-seg .on { background: #ebc37d; }
</style>
<div id="chat"><div class="mes" mesid="79"><button class="pc-mes-comic">画成漫画</button><div class="mes_text">合成剧情，测试角色在雨天走进咖啡馆。</div></div></div>
<section id="settings"></section>
<button data-act="image-backfill">补未生图楼层</button>
<pre id="results">运行中</pre>
<script type="module">
import { createComicController, onChatClick, createImageBackfill, createImageBackfillUI, onBackfillClick } from './runtime-comic.js';
const checks = [];
function check(name, value) {
    if (!value) throw new Error(name);
    checks.push(name);
}
const nextTurn = () => new Promise(resolve => setTimeout(resolve, 0));
const page = `<image>@page
comic page, 2 panels, vertical layout
@panel P1
top half, cafe interior
@character C1
boy, black hair, white shirt
Text: 早上好。
@panel P2
bottom half, rainy window
@character C1
boy, black hair, white shirt, smiling
Text: 雨停了。
</image>`;
const data = { options: { comicOn: true }, groups: {}, active: null };
const message = { name: '合成角色', is_system: true, mes: 'A person enters a cafe and greets the owner.' };
const context = { chatId: 'browser-fixture', chat: [], saveChat: async () => {} };
context.chat[79] = message;
const image = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a0uoAAAAASUVORK5CYII=';
const requests = [];
let aiCalls = 0;
let drawBarrier = null;
const controller = createComicController({
    document, getContext: () => context, getData: () => data, commit() {},
    esc: value => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;'),
    askLLM: async () => { aiCalls++; return page; },
    generatePage: async request => { requests.push(request); if (drawBarrier) await drawBarrier; return { image }; },
    storeImage: async () => ({ url: image }), resolveUrl: value => value,
    notify() {}, notifyError: value => { throw new Error(value); },
});
globalThis.__zhikuComic = controller;
document.addEventListener('click', onChatClick, true);
document.addEventListener('click', onBackfillClick);
const escape = value => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
const batch = createImageBackfill({ getContext: () => context, comic: controller, marker: { status: () => ({ images: 0 }) }, planner: { status: () => ({}) } });
const batchUI = createImageBackfillUI({ controller: batch, getContext: () => context, esc: escape, apiLabel: () => '合成副 API', modal: html => {
    const box = document.createElement('section'); box.style.cssText = 'max-width:600px;margin:auto'; box.innerHTML = html; box.closeModal = () => box.remove(); document.body.append(box); return box;
} });
globalThis.__zhikuBackfill = batchUI;
window.stcrSelfTest = async () => {
    document.querySelector('.pc-mes-comic').click();
    await nextTurn();
    check('隐藏楼层的正式按钮进入漫画流程', requests.length === 1);
    check('生成状态收尾后显示图片', !!document.querySelector('.pc-comic-page img'));
    check('原生人物包含画格和对白', /panel 2/.test(requests[0].chars[1].prompt) && /Text: 雨停了/.test(requests[0].chars[1].prompt));
    check('原生对白版本按图内文字显示', !document.querySelector('.pc-comic-caps'));
    document.querySelector('.pc-comic-page img').click();
    check('点图展开重画按钮', document.querySelector('.pc-comic-page').classList.contains('acts'));
    document.querySelector('[data-cgen]').click();
    await nextTurn();
    check('重画生成第二版', requests.length === 2 && Object.values(message.extra.zhikuComic)[0].versions.length === 2);
    document.querySelector('[data-cv="-1"]').click();
    await nextTurn();
    check('可以切回第一版', Object.values(message.extra.zhikuComic)[0].cur === 0);
    controller.openSettings(document.querySelector('#settings'));
    check('设置默认选中 NAI 原生对白', document.querySelector('[data-cs="comicText"][data-v="draw"]').classList.contains('on'));
    document.querySelector('[data-cs="comicText"][data-v="overlay"]').click();
    document.querySelector('[data-cgen]').click();
    await nextTurn();
    check('插件叠字选择可独立使用', data.options.comicText === 'overlay' && !!document.querySelector('.pc-comic-caps'));
    check('手动生成保留消息隐藏状态和正文', message.is_system && message.mes === 'A person enters a cafe and greets the owner.');
    context.chat[80] = { name: '合成角色', is_system: true, mes: 'A person opens a book by the window.' };
    context.chat[81] = { name: '合成角色', mes: 'A person puts down a cup in the cafe.' };
    document.querySelector('[data-act="image-backfill"]').click();
    const from = document.querySelector('[data-backfill-from]'), to = document.querySelector('[data-backfill-to]');
    from.value = '79'; to.value = '81'; from.dispatchEvent(new Event('change', { bubbles: true }));
    check('正式补图入口可选漫画和楼层范围', document.querySelector('[data-backfill-mode]').value === 'comic' && to.value === '81');
    check('预览跳过已有漫画并统计隐藏楼', document.querySelector('[data-backfill-preview]').textContent.includes('可补 2 楼'));
    let release;
    drawBarrier = new Promise(resolve => { release = resolve; });
    document.querySelector('[data-backfill-start]').click(); await nextTurn();
    check('进度展示当前楼且禁止重复开始', document.querySelector('[data-backfill-start]').disabled && document.querySelector('[data-backfill-status]').textContent.includes('80'));
    document.querySelector('[data-backfill-stop]').click();
    check('停止按钮等待当前楼层收尾', document.querySelector('[data-backfill-status]').textContent.includes('等待当前楼层'));
    release(); drawBarrier = null; await nextTurn();
    check('停止后保留成功图片并跳过后续楼', controller.status(80).images === 1 && controller.status(81).images === 0 && !batch.snapshot().running);
    document.querySelector('[data-backfill-close]').click();
    document.querySelector('[data-act="image-backfill"]').click();
    check('重新打开仍显示上一轮进度', document.querySelector('[data-backfill-results]').textContent.includes('#80 · 成功'));
    document.querySelector('[data-backfill-from]').value = '81'; document.querySelector('[data-backfill-to]').value = '81';
    document.querySelector('[data-backfill-start]').click(); await nextTurn();
    check('指定单楼继续补图', controller.status(81).images === 1 && batch.snapshot().rows.length === 1);
    check('手机展示副 API 来源且没有横向溢出', document.querySelector('[data-backfill-api]').textContent.includes('合成副 API') && document.documentElement.scrollWidth <= window.innerWidth);
    document.querySelector('[data-backfill-close]').click();
    const multiPage = page + '\n\n' + page.replace('cafe interior', 'library interior').replace('雨停了。', '找到书了。');
    context.chat[82] = { name: '合成角色', mes: multiPage };
    const row = document.createElement('div'); row.className = 'mes'; row.setAttribute('mesid', '82'); row.innerHTML = '<div class="mes_text">等雨后去图书馆，两段剧情。</div>'; document.querySelector('#chat').append(row);
    await controller.process(82, { manual: true });
    check('一条正文展示两张独立漫画页', row.querySelectorAll('.pc-comic-page').length === 2);
    const previousCalls = aiCalls, previousDraws = requests.length;
    drawBarrier = new Promise(resolve => { release = resolve; });
    row.querySelector('[data-credall]').click(); await nextTurn();
    check('正式整楼重画按钮展示进度并防止重复', row.querySelector('[data-credall]').disabled && row.querySelector('[role="status"]').textContent.includes('1 / 2'));
    release(); drawBarrier = null; await nextTurn();
    check('一次操作重画全部两页并保留旧版', requests.length === previousDraws + 2 && Object.values(context.chat[82].extra.zhikuComic).every(record => record.versions.length === 2));
    check('整楼重画保留分镜并复用提示词', context.chat[82].mes === multiPage && aiCalls === previousCalls && requests[previousDraws].positive === requests[previousDraws - 2].positive && requests[previousDraws + 1].positive === requests[previousDraws - 1].positive);
    check('整楼重画使用新种子且收尾恢复按钮', requests.slice(previousDraws).every(request => Number.isSafeInteger(request.seed)) && !row.querySelector('[data-credall]').disabled);
    check('多页和整楼操作在手机宽度内换行', document.documentElement.scrollWidth <= window.innerWidth);
    return checks;
};
try {
    await window.stcrSelfTest();
    document.querySelector('#results').textContent = JSON.stringify({ passed: checks.length, checks });
} catch (error) {
    document.querySelector('#results').textContent = JSON.stringify({ error: error.message, checks });
}
</script>
</html>
